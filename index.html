<style>
/* ============================================================
   RESET & DESIGN TOKENS
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#f4f6fb;
  --bg-secondary:#e8ecf6;
  --card:#ffffff;
  --card-secondary:#f6f8fd;
  --text:#0f172a;
  --text-secondary:#475569;
  --text-tertiary:#8b94a7;
  --text-quaternary:#b3bac9;
  --text-inverse:#ffffff;

  --primary:#0b2a72;
  --primary-dark:#081f56;
  --primary-light:#1b4bc4;
  --primary-gradient:linear-gradient(135deg,#0b2a72 0%,#1b4bc4 100%);
  --primary-surface:#e7edfb;

  --accent:#ffc800;
  --accent-dark:#e0af00;

  --separator:#e4e8f1;
  --separator-heavy:#cfd6e5;

  --shadow:0 2px 16px rgba(11,42,114,.07);
  --shadow-lg:0 8px 40px rgba(11,42,114,.14);
  --shadow-modal:0 -8px 40px rgba(11,42,114,.16);

  --radius:16px;
  --radius-sm:12px;
  --radius-full:9999px;

  --tab-height:72px;
  --header-height:64px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
  --transition:.25s cubic-bezier(.2,.9,.4,1);
}

[data-theme="dark"]{
  --bg:#080b14;
  --bg-secondary:#121826;
  --card:#121826;
  --card-secondary:#1b2333;
  --text:#f1f5fd;
  --text-secondary:#a8b3c9;
  --text-tertiary:#7d879c;
  --text-quaternary:#5b6478;
  --text-inverse:#0b1020;

  --primary:#ffc800;
  --primary-dark:#e0af00;
  --primary-light:#ffd633;
  --primary-gradient:linear-gradient(135deg,#0b2a72 0%,#1b4bc4 100%);
  --primary-surface:#1e2740;

  --accent:#ffc800;

  --separator:#242e42;
  --separator-heavy:#333e56;

  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 8px 40px rgba(0,0,0,.6);
  --shadow-modal:0 -8px 40px rgba(0,0,0,.6);
}

html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  padding-top:var(--header-height);
  padding-bottom:calc(var(--tab-height) + var(--safe-bottom) + 8px);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-user-select:none;
  user-select:none;
}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--separator-heavy);border-radius:20px}
::selection{background:var(--primary);color:var(--text-inverse)}

/* ============================================================
   HEADER
   ============================================================ */
.ios-header{
  position:fixed;top:0;left:0;right:0;
  height:var(--header-height);
  padding-top:var(--safe-top);
  background:var(--card);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--separator);
  z-index:100;
}
.header-content{
  max-width:600px;margin:0 auto;padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between;height:100%;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:var(--primary-gradient);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 3px 12px rgba(11,42,114,.3);
  overflow:hidden;
}
.brand-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.brand h1{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1.1}
.brand p{font-size:11px;color:var(--text-secondary);font-weight:600;letter-spacing:-.1px}

.cart-btn{
  position:relative;font-size:21px;color:var(--text-secondary);
  padding:6px 8px;border:none;background:none;cursor:pointer;
  transition:var(--transition);border-radius:50%;
  -webkit-tap-highlight-color:transparent;flex-shrink:0;
}
.cart-btn:active{transform:scale(.92);color:var(--primary)}
.cart-btn .badge{
  position:absolute;top:0;right:0;background:var(--primary);color:var(--text-inverse);
  font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:30px;
  display:none;align-items:center;justify-content:center;padding:0 5px;line-height:1;
  transform:translate(4px,-4px);border:2px solid var(--card);
}
.cart-btn .badge.show{display:flex}

/* ============================================================
   TABS
   ============================================================ */
.ios-tabs{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--tab-height) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:var(--card);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--separator);
  display:flex;align-items:stretch;justify-content:space-around;
  z-index:999;box-shadow:0 -2px 20px rgba(11,42,114,.06);
}
.ios-tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;font-size:10px;font-weight:600;color:var(--text-tertiary);
  background:none;border:none;padding:4px 0;cursor:pointer;position:relative;
  transition:var(--transition);font-family:inherit;
}
.ios-tabs button i{font-size:21px;transition:var(--transition)}
.ios-tabs button span{line-height:1.2;letter-spacing:-.2px}
.ios-tabs button.active{color:var(--primary)}
.ios-tabs button.active i{transform:scale(1.06)}
.ios-tabs button:active{transform:scale(.94)}
.ios-tabs .tab-badge{
  position:absolute;top:2px;right:50%;
  transform:translateX(calc(50% + 14px));
  background:var(--primary);color:var(--text-inverse);
  font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:30px;
  display:none;align-items:center;justify-content:center;padding:0 5px;line-height:1;
}
.ios-tabs .tab-badge.show{display:flex}

/* ============================================================
   CONTENT
   ============================================================ */
.ios-content{max-width:600px;margin:0 auto;padding:12px 16px 20px}
.page{display:none;animation:fadeUp .35s cubic-bezier(.2,.9,.4,1)}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.section-title{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--text);margin-bottom:2px}
.section-sub{font-size:14px;color:var(--text-secondary);margin-bottom:14px}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  background:var(--primary-gradient);
  border-radius:var(--radius);padding:28px 24px 24px;margin-bottom:18px;
  position:relative;overflow:hidden;color:#fff;
  box-shadow:0 10px 30px rgba(11,42,114,.28);
}
.hero::after{
  content:"🧊";position:absolute;right:-6px;bottom:-18px;font-size:110px;
  opacity:.10;transform:rotate(-8deg);pointer-events:none;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:var(--radius-full);
  font-size:11px;font-weight:700;letter-spacing:.3px;margin-bottom:12px;
  background:rgba(255,200,0,.22);color:#ffd633;border:1px solid rgba(255,200,0,.35);
}
.hero h2{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin-bottom:6px;color:#fff}
.hero p{font-size:14.5px;opacity:.9;max-width:330px;margin-bottom:16px;line-height:1.5;color:#fff}
.hero-price{
  display:inline-flex;align-items:baseline;gap:6px;margin-bottom:16px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  padding:8px 18px;border-radius:var(--radius-full);
}
.hero-price strong{font-size:24px;font-weight:800;color:#ffc800;letter-spacing:-.5px}
.hero-price span{font-size:12px;opacity:.85;color:#fff}

.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.hero-actions .btn{
  padding:11px 22px;border-radius:var(--radius-full);font-weight:800;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;transition:var(--transition);
  border:none;cursor:pointer;text-decoration:none;font-family:inherit;
}
.hero-actions .btn:active{transform:scale(.96)}
.btn-white{background:#fff;color:#0b2a72}
.btn-white:hover{box-shadow:0 4px 20px rgba(0,0,0,.2)}
.btn-outline-white{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4) !important}
.btn-outline-white:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7) !important}

/* ============================================================
   STATS
   ============================================================ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{
  background:var(--card);border-radius:var(--radius-sm);padding:14px 8px;text-align:center;
  box-shadow:var(--shadow);border:1px solid var(--separator);
}
.stat i{font-size:19px;color:var(--primary);display:block;margin-bottom:3px}
.stat strong{display:block;font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.stat small{font-size:10.5px;color:var(--text-tertiary);font-weight:600}

/* ============================================================
   HORIZONTAL SCROLL CARDS
   ============================================================ */
.scroll-horizontal{
  display:flex;gap:14px;overflow-x:auto;padding:4px 0 14px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  margin:0 -4px;scrollbar-width:none;
}
.scroll-horizontal::-webkit-scrollbar{display:none}
.scroll-card{
  flex:0 0 180px;scroll-snap-align:start;background:var(--card);border-radius:var(--radius-sm);
  padding:14px 12px 16px;box-shadow:var(--shadow);text-align:center;
  transition:var(--transition);border:1px solid var(--separator);cursor:pointer;
}
.scroll-card:active{transform:scale(.96)}
.scroll-card img{
  width:96px;height:96px;border-radius:var(--radius-sm);object-fit:cover;
  margin:0 auto 10px;background:var(--bg-secondary);display:block;
}
.scroll-card h4{font-size:14px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll-card .price{font-size:16px;font-weight:800;color:var(--primary);margin-top:2px}
.scroll-card .add-btn{
  margin-top:8px;background:var(--primary);color:var(--text-inverse);
  padding:5px 18px;border-radius:var(--radius-full);font-size:12px;font-weight:800;
  border:none;cursor:pointer;transition:var(--transition);font-family:inherit;
}
.scroll-card .add-btn:active{transform:scale(.92)}

/* ============================================================
   ABOUT
   ============================================================ */
.about-snippet{
  background:var(--card);border-radius:var(--radius);padding:20px 22px;
  box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--separator);
}
.about-snippet h3{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-.3px}
.about-snippet h3 span{color:var(--primary)}
.about-snippet p{font-size:14px;color:var(--text-secondary);line-height:1.65;margin-bottom:6px}
.about-snippet .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.about-snippet .tags span{
  background:var(--card-secondary);padding:5px 14px;border-radius:var(--radius-full);
  font-size:12px;font-weight:700;color:var(--text-secondary);border:1px solid var(--separator);
}
.about-snippet .tags span i{color:var(--primary);margin-right:4px}

/* ============================================================
   INFO STRIP
   ============================================================ */
.info-strip{
  background:var(--card);border-radius:var(--radius);padding:16px 18px;
  box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--separator);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
}
.info-strip .left{display:flex;align-items:center;gap:12px;min-width:0}
.info-strip .emoji{font-size:26px;line-height:1}
.info-strip .t1{font-weight:800;font-size:14px;color:var(--text)}
.info-strip .t2{font-size:12px;color:var(--text-tertiary);font-weight:500}

/* ============================================================
   MENU
   ============================================================ */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.menu-item{
  background:var(--card);border-radius:var(--radius-sm);padding:14px 14px 16px;
  box-shadow:var(--shadow);transition:var(--transition);border:1px solid var(--separator);
  display:flex;flex-direction:column;cursor:pointer;
}
.menu-item:active{transform:scale(.97)}
.menu-item img{
  width:100%;aspect-ratio:1/1;border-radius:var(--radius-sm);
  object-fit:cover;background:var(--bg-secondary);margin-bottom:10px;display:block;
}
.menu-item h4{font-size:14.5px;font-weight:800;color:var(--text);line-height:1.2}
.menu-item .desc{font-size:12px;color:var(--text-tertiary);margin-top:3px;flex:1;line-height:1.35}
.menu-item .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.menu-item .price{font-size:16px;font-weight:800;color:var(--primary)}
.menu-item .add-small{
  background:var(--primary);color:var(--text-inverse);padding:5px 15px;
  border-radius:var(--radius-full);font-size:12px;font-weight:800;
  border:none;cursor:pointer;transition:var(--transition);font-family:inherit;
}
.menu-item .add-small:active{transform:scale(.92)}

/* ============================================================
   CART
   ============================================================ */
.cart-empty{text-align:center;padding:48px 20px;color:var(--text-secondary)}
.cart-empty i{font-size:54px;color:var(--text-quaternary);display:block;margin-bottom:12px}
.cart-empty h3{font-size:19px;font-weight:800;color:var(--text);margin-bottom:4px}
.cart-empty p{font-size:14px}
.cart-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.cart-item{
  background:var(--card);border-radius:var(--radius-sm);padding:14px 16px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
  border:1px solid var(--separator);
}
.cart-item img{
  width:54px;height:54px;border-radius:var(--radius-sm);object-fit:cover;
  background:var(--bg-secondary);flex-shrink:0;
}
.cart-item .info{flex:1;min-width:0}
.cart-item .info h4{font-size:14px;font-weight:800;color:var(--text)}
.cart-item .info .price{font-size:14px;font-weight:800;color:var(--primary)}
.cart-item .info .request{font-size:11px;color:var(--text-tertiary);font-style:italic;margin-top:2px}
.cart-item .controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cart-item .controls button{
  width:28px;height:28px;border-radius:50%;background:var(--card-secondary);
  font-size:14px;font-weight:800;color:var(--text-secondary);
  transition:var(--transition);border:1px solid var(--separator);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
}
.cart-item .controls button:active{transform:scale(.9);background:var(--primary);color:var(--text-inverse)}
.cart-item .controls button.remove{background:none;border:none;color:var(--text-quaternary);font-size:15px}
.cart-item .controls button.remove:active{color:#ff3b30;background:none}
.cart-item .controls .qty{font-weight:800;font-size:14px;min-width:20px;text-align:center;color:var(--text)}

.cart-summary{
  background:var(--card);border-radius:var(--radius);padding:18px 20px 20px;
  box-shadow:var(--shadow);margin-top:4px;border:1px solid var(--separator);
}
.cart-summary .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--text-secondary)}
.cart-summary .row.total{
  font-size:20px;font-weight:800;color:var(--text);
  border-top:1px solid var(--separator);padding-top:12px;margin-top:4px;
}
.cart-summary .row.total .amount{color:var(--primary)}
.cart-summary .checkout-btn{
  width:100%;padding:15px;border-radius:var(--radius-full);background:#25D366;color:#fff;
  font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;
  gap:10px;border:none;cursor:pointer;transition:var(--transition);margin-top:14px;font-family:inherit;
  box-shadow:0 6px 20px rgba(37,211,102,.35);
}
.cart-summary .checkout-btn:active{transform:scale(.97)}
.cart-summary .checkout-btn i{font-size:20px}
.cart-summary .alt-btn{
  width:100%;padding:13px;border-radius:var(--radius-full);background:var(--card-secondary);
  color:var(--text);font-weight:800;font-size:14px;display:flex;align-items:center;
  justify-content:center;gap:8px;border:1px solid var(--separator);cursor:pointer;
  transition:var(--transition);margin-top:10px;font-family:inherit;
}
.cart-summary .alt-btn:active{transform:scale(.97)}

/* ============================================================
   ORDERS
   ============================================================ */
.order-card{
  background:var(--card);border-radius:var(--radius-sm);padding:16px 18px;
  box-shadow:var(--shadow);margin-bottom:10px;
  border:1px solid var(--separator);border-left:4px solid var(--primary);
}
.order-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.order-card .top .date{font-size:12.5px;color:var(--text-tertiary);font-weight:600}
.order-card .top .status{
  font-size:11px;font-weight:800;color:#0d7b37;background:#e8f8ed;
  padding:3px 13px;border-radius:var(--radius-full);white-space:nowrap;
}
[data-theme="dark"] .order-card .top .status{background:#16311f;color:#4ade80}
.order-card .items{font-size:13.5px;color:var(--text-secondary);margin-top:8px;line-height:1.5}
.order-card .total{font-size:16px;font-weight:800;color:var(--text);margin-top:6px}
.order-empty{text-align:center;padding:48px 20px;color:var(--text-secondary)}
.order-empty i{font-size:46px;color:var(--text-quaternary);display:block;margin-bottom:12px}
.order-empty h3{font-size:18px;font-weight:800;color:var(--text);margin-bottom:4px}

.clear-orders-btn{
  width:100%;padding:14px;border-radius:var(--radius-full);
  background:#ff3b30;color:#fff;font-weight:800;font-size:15px;
  border:none;cursor:pointer;transition:var(--transition);margin-top:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;
}
.clear-orders-btn:active{transform:scale(.97);opacity:.85}

/* ============================================================
   PROFILE
   ============================================================ */
.profile-card{
  background:var(--card);border-radius:var(--radius);padding:26px 22px;
  box-shadow:var(--shadow);margin-bottom:16px;text-align:center;
  border:1px solid var(--separator);
}
.profile-card .logo{
  width:82px;height:82px;border-radius:50%;background:var(--primary-gradient);
  margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  font-size:36px;box-shadow:0 8px 26px rgba(11,42,114,.35);overflow:hidden;
}
.profile-card .logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.profile-card h2{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.profile-card .sub{font-size:13.5px;color:var(--text-secondary);margin-top:3px}
.profile-card .badge-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.profile-card .badge-row span{
  background:var(--card-secondary);padding:5px 14px;border-radius:var(--radius-full);
  font-size:12px;font-weight:700;color:var(--text-secondary);border:1px solid var(--separator);
}
.profile-card .badge-row span i{color:var(--primary);margin-right:4px}

.profile-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.profile-links a{
  background:var(--card);border-radius:var(--radius-sm);padding:15px 16px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;
  font-size:13.5px;font-weight:700;color:var(--text);transition:var(--transition);
  border:1px solid var(--separator);text-decoration:none;
}
.profile-links a:active{transform:scale(.96)}
.profile-links a i{font-size:17px;color:var(--primary);width:22px;text-align:center;flex-shrink:0}

.profile-hours{
  background:var(--card);border-radius:var(--radius);padding:18px 22px;
  box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--separator);
}
.profile-hours h4{font-size:15px;font-weight:800;color:var(--text);margin-bottom:8px}
.profile-hours h4 i{color:var(--primary);margin-right:6px}
.profile-hours p{font-size:13.5px;color:var(--text-secondary);padding:3px 0}
.profile-hours p i{color:var(--primary);margin-right:8px;width:16px;text-align:center}

.contact-box{
  background:var(--card);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--separator);
}
.contact-box h4{font-size:15px;font-weight:800;color:var(--text);margin-bottom:10px}
.contact-box h4 i{color:var(--primary);margin-right:6px}
.contact-box a{
  display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;
  color:var(--text-secondary);text-decoration:none;padding:7px 0;
  border-bottom:1px solid var(--separator);
}
.contact-box a:last-child{border-bottom:none}
.contact-box a i{color:var(--primary);width:18px;text-align:center}
.contact-box a:active{color:var(--primary)}

.notice-box{
  background:var(--card);border-radius:var(--radius);padding:14px 16px;
  box-shadow:var(--shadow);font-size:12px;color:var(--text-tertiary);
  text-align:center;border-left:3px solid var(--primary);line-height:1.55;
}
.notice-box i{color:var(--primary);margin-right:5px}

/* ============================================================
   MODAL
   ============================================================ */
.ios-modal{
  position:fixed;inset:0;background:rgba(6,12,30,.58);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:2000;display:none;align-items:flex-end;justify-content:center;padding:20px;
}
.ios-modal.open{display:flex}
.modal-sheet{
  background:var(--card);width:100%;max-width:500px;border-radius:28px 28px 0 0;
  padding:24px 24px 32px;animation:slideUp .4s cubic-bezier(.2,.9,.4,1);
  max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-modal);
  border:1px solid var(--separator);border-bottom:none;
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-sheet .handle{width:40px;height:4px;border-radius:10px;background:var(--separator-heavy);margin:0 auto 16px}
.modal-sheet img{
  width:100%;max-height:210px;object-fit:cover;border-radius:var(--radius-sm);
  background:var(--bg-secondary);margin-bottom:14px;display:block;
}
.modal-sheet h3{font-size:21px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.modal-sheet .modal-desc{font-size:13.5px;color:var(--text-secondary);margin:5px 0 10px;line-height:1.5}
.modal-sheet .modal-price{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:14px;letter-spacing:-.5px}

.modal-qty{display:flex;align-items:center;gap:14px;margin:12px 0}
.modal-qty button{
  width:42px;height:42px;border-radius:50%;background:var(--card-secondary);
  font-size:17px;font-weight:800;color:var(--text-secondary);
  border:1px solid var(--separator);cursor:pointer;transition:var(--transition);
  display:flex;align-items:center;justify-content:center;font-family:inherit;
}
.modal-qty button:active{transform:scale(.9);background:var(--primary);color:var(--text-inverse);border-color:var(--primary)}
.modal-qty input{
  width:64px;text-align:center;font-size:18px;font-weight:800;
  background:var(--card-secondary);border-radius:var(--radius-sm);padding:9px;
  border:1px solid var(--separator);font-family:inherit;color:var(--text);
}
.modal-qty input:focus{border-color:var(--primary);outline:none}

.modal-request{margin:12px 0 16px}
.modal-request label{display:block;font-size:12.5px;font-weight:700;color:var(--text-secondary);margin-bottom:6px}
.modal-request label i{margin-right:4px;color:var(--primary)}
.modal-request textarea{
  width:100%;padding:11px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--separator);background:var(--card-secondary);
  resize:vertical;font-size:14px;font-family:inherit;transition:var(--transition);color:var(--text);
}
.modal-request textarea:focus{border-color:var(--primary);outline:none}
.modal-request textarea::placeholder{color:var(--text-quaternary)}

.modal-actions{display:flex;flex-direction:column;gap:10px}
.modal-actions .btn-add{
  background:var(--primary);color:var(--text-inverse);padding:15px;
  border-radius:var(--radius-full);font-weight:800;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  border:none;cursor:pointer;transition:var(--transition);font-family:inherit;
}
.modal-actions .btn-add:active{transform:scale(.97)}
.modal-actions .btn-wa{
  background:#25D366;color:#fff;padding:15px;border-radius:var(--radius-full);
  font-weight:800;font-size:16px;display:flex;align-items:center;
  justify-content:center;gap:10px;text-decoration:none;transition:var(--transition);
}
.modal-actions .btn-wa:active{transform:scale(.97)}

/* ============================================================
   TOAST
   ============================================================ */
.ios-toast{
  position:fixed;bottom:calc(var(--tab-height) + var(--safe-bottom) + 20px);
  left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--text);color:var(--bg);
  padding:12px 24px;border-radius:var(--radius-full);
  font-size:13.5px;font-weight:700;box-shadow:var(--shadow-lg);
  z-index:3000;opacity:0;transition:all .4s cubic-bezier(.2,.9,.4,1);
  white-space:nowrap;pointer-events:none;font-family:inherit;
  max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
.ios-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   THEME TOGGLE
   ============================================================ */
.theme-toggle-ios{
  position:fixed;top:76px;right:16px;z-index:999;
  background:var(--card);border:1px solid var(--separator);border-radius:50%;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  font-size:17px;cursor:pointer;transition:all .3s cubic-bezier(.2,.9,.4,1);
  box-shadow:var(--shadow);color:var(--text);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.theme-toggle-ios:hover{transform:scale(1.08);box-shadow:var(--shadow-lg)}
.theme-toggle-ios:active{transform:scale(.92)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (min-width:600px){
  .menu-grid{grid-template-columns:repeat(2,1fr);gap:16px}
  .scroll-card{flex:0 0 200px}
  .ios-content{padding:16px 20px 24px}
}
@media (min-width:768px){
  .ios-content{max-width:700px}
  .hero{padding:38px 34px 30px}
  .hero h2{font-size:33px}
  .profile-links{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:480px){
  .hero h2{font-size:23px}
  .hero{padding:22px 18px 20px}
  .stats{gap:8px}
  .stat{padding:11px 6px}
  .stat strong{font-size:13.5px}
  .stat small{font-size:9.5px}
  .scroll-card{flex:0 0 152px}
  .scroll-card img{width:82px;height:82px}
  .profile-links{grid-template-columns:1fr}
  .modal-sheet{padding:20px 18px 26px}
  .modal-sheet h3{font-size:19px}
  .modal-sheet .modal-price{font-size:24px}
  .brand h1{font-size:15px}
  .brand p{font-size:10px}
  .ios-toast{font-size:12.5px;padding:11px 18px;white-space:normal;text-align:center}
  .theme-toggle-ios{top:70px;right:12px;width:36px;height:36px;font-size:15px}
}
@media (max-width:380px){
  .menu-grid{gap:9px}
  .menu-item{padding:10px 10px 13px}
  .menu-item h4{font-size:13px}
  .menu-item .price{font-size:14px}
  .hero h2{font-size:20px}
  .hero{padding:18px 15px 17px}
  .hero-actions .btn{padding:9px 16px;font-size:12.5px}
  .scroll-card{flex:0 0 132px}
  .scroll-card img{width:72px;height:72px}
  .ios-tabs button{font-size:9px}
  .ios-tabs button i{font-size:18px}
}

@media print{
  .ios-header,.ios-tabs,.theme-toggle-ios,.ios-modal,.ios-toast{display:none !important}
  body{padding:0}
}
</style>
</head>
<body>

<!-- ===== THEME TOGGLE ===== -->
<button class="theme-toggle-ios" id="themeToggle" aria-label="Toggle dark mode">
  <i class="fas fa-moon" id="themeIcon"></i>
</button>

<!-- ===== HEADER ===== -->
<header class="ios-header">
  <div class="header-content">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <img src="logo.webp" alt="ZUS Coffee Ngupi @ Restoran Pak Haji Ali logo" />
      </div>
      <div>
        <h1>ZUS Coffee Ngupi</h1>
        <p>@ Restoran Pak Haji Ali</p>
      </div>
    </div>
    <button class="cart-btn" id="headerCartBtn" aria-label="Open cart">
      <i class="fas fa-shopping-bag"></i>
      <span class="badge" id="headerCartBadge">0</span>
    </button>
  </div>
</header>

<!-- ===== BOTTOM TABS ===== -->
<nav class="ios-tabs" id="iosTabs" role="tablist">
  <button class="active" data-tab="home" role="tab" aria-selected="true">
    <i class="fas fa-house"></i><span>Home</span>
  </button>
  <button data-tab="menu" role="tab" aria-selected="false">
    <i class="fas fa-mug-hot"></i><span>Menu</span>
  </button>
  <button data-tab="cart" role="tab" aria-selected="false" id="navCartBtn">
    <i class="fas fa-shopping-bag"></i><span>Cart</span>
    <span class="tab-badge" id="tabCartBadge">0</span>
  </button>
  <button data-tab="orders" role="tab" aria-selected="false">
    <i class="fas fa-clock-rotate-left"></i><span>Orders</span>
  </button>
  <button data-tab="profile" role="tab" aria-selected="false">
    <i class="fas fa-user"></i><span>Profile</span>
  </button>
</nav>

<!-- ===== CONTENT ===== -->
<main class="ios-content" id="iosContent">
  <section class="page active" id="pageHome" data-page="home"></section>
  <section class="page" id="pageMenu" data-page="menu"></section>
  <section class="page" id="pageCart" data-page="cart"></section>
  <section class="page" id="pageOrders" data-page="orders"></section>
  <section class="page" id="pageProfile" data-page="profile"></section>
</main>

<!-- ===== MODAL ===== -->
<div class="ios-modal" id="iosModal" role="dialog" aria-modal="true" aria-label="Item options">
  <div class="modal-sheet">
    <div class="handle"></div>
    <img id="modalImg" src="" alt="Drink" loading="lazy" />
    <h3 id="modalName">Product Name</h3>
    <p class="modal-desc" id="modalDesc">Description</p>
    <div class="modal-price" id="modalPrice">RM0.00</div>

    <div class="modal-qty">
      <button id="modalQtyMinus" aria-label="Decrease quantity"><i class="fas fa-minus"></i></button>
      <input type="number" id="modalQty" value="1" min="1" max="99" aria-label="Quantity" />
      <button id="modalQtyPlus" aria-label="Increase quantity"><i class="fas fa-plus"></i></button>
    </div>

    <div class="modal-request">
      <label for="modalRequest"><i class="fas fa-pen"></i> Special request (optional)</label>
      <textarea id="modalRequest" rows="2" placeholder="e.g. less sweet, extra ice..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-add" id="modalAddCart"><i class="fas fa-cart-plus"></i> Add to Cart</button>
      <a class="btn-wa" id="modalWaBtn" href="#" target="_blank" rel="noopener">
        <i class="fab fa-whatsapp"></i> Order via WhatsApp
      </a>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="ios-toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SHOP = {
  name: "ZUS Coffee Ngupi @ Restoran Pak Haji Ali",
  tagline: "Jom Ngupi",
  phoneLocal: "0176562062",
  phoneIntl: "60176562062",
  phoneDisplay: "017-656 2062",
  email: "zuscoffeengupi@gmail.com",
  waBase: "https://wa.me/60176562062",
  siteUrl: "https://zuscoffee.github.io/zuscoffee/"
};

/* ============================================================
   MENU DATA — ONLY TWO ITEMS, SERVED COLD
   ============================================================ */
const MENU_DATA = [
  {
    name: "White Coffee",
    desc: "Smooth, creamy Malaysian-style white coffee. Served ice-cold.",
    price: 3.90,
    img: "images/whitecoffee.webp",
    emoji: "☕"
  },
  {
    name: "Chocolate Coffee",
    desc: "Rich chocolate blended with freshly brewed coffee. Served ice-cold.",
    price: 3.90,
    img: "images/chocolatecoffee.webp",
    emoji: "🍫"
  }
];

const FALLBACK_IMG =
  "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'>" +
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
    "<stop offset='0%' stop-color='#0b2a72'/><stop offset='100%' stop-color='#1b4bc4'/>" +
    "</linearGradient></defs>" +
    "<rect width='200' height='200' fill='url(%23g)'/>" +
    "<text x='100' y='125' font-size='90' text-anchor='middle'>☕</text></svg>"
  );

/* ============================================================
   APP
   ============================================================ */
(function () {
  "use strict";

  let cart = [];
  let orders = [];
  let currentTab = "home";
  let modalData = null;
  let isModalOpen = false;

  const $ = (id) => document.getElementById(id);
  const fmt = (p) => "RM" + Number(p).toFixed(2);

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function imgTag(src, alt, cls) {
    const s = escapeHtml(src || FALLBACK_IMG);
    return '<img src="' + s + '" alt="' + escapeHtml(alt) + '"' +
           (cls ? ' class="' + cls + '"' : "") +
           ' loading="lazy" onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'" />';
  }

  function toast(msg) {
    const el = $("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  function saveCart() {
    try { localStorage.setItem("ngupi_cart", JSON.stringify(cart)); } catch (e) {}
    updateBadges();
  }
  function loadCart() {
    try {
      const d = localStorage.getItem("ngupi_cart");
      if (d) cart = JSON.parse(d);
    } catch (e) { cart = []; }
    if (!Array.isArray(cart)) cart = [];
    cart = cart.filter(i => i && typeof i.price === "number" && typeof i.qty === "number");
    updateBadges();
  }
  function saveOrders() {
    try { localStorage.setItem("ngupi_orders", JSON.stringify(orders)); } catch (e) {}
  }
  function loadOrders() {
    try {
      const d = localStorage.getItem("ngupi_orders");
      if (d) orders = JSON.parse(d);
    } catch (e) { orders = []; }
    if (!Array.isArray(orders)) orders = [];
  }

  function updateBadges() {
    const total = cart.reduce((s, i) => s + i.qty, 0);
    const hb = $("headerCartBadge");
    if (hb) { hb.textContent = total; hb.classList.toggle("show", total > 0); }
    const tb = $("tabCartBadge");
    if (tb) { tb.textContent = total; tb.classList.toggle("show", total > 0); }
  }

  const cartTotal = () => cart.reduce((s, i) => s + i.price * i.qty, 0);
  const cartCount = () => cart.reduce((s, i) => s + i.qty, 0);

  /* ---------- HOME ---------- */
  function renderHome() {
    const c = $("pageHome");
    if (!c) return;

    const featuredHTML = MENU_DATA.map(item => `
      <div class="scroll-card"
           data-name="${escapeHtml(item.name)}"
           data-price="${item.price}"
           data-img="${escapeHtml(item.img)}"
           data-desc="${escapeHtml(item.desc)}">
        ${imgTag(item.img, item.name)}
        <h4>${escapeHtml(item.name)}</h4>
        <div class="price">${fmt(item.price)}</div>
        <button class="add-btn" type="button">+ Add</button>
      </div>
    `).join("");

    c.innerHTML = `
      <div class="hero">
        <div class="hero-badge"><i class="fas fa-snowflake"></i> Ice-Cold Only</div>
        <h2>Ice-Cold White Coffee &amp;<br />Chocolate Coffee</h2>
        <p>Freshly brewed, served over ice — every cup.</p>

    c.querySelectorAll(".scroll-card").forEach(card => {

  /* ---------- MENU ---------- */
  function renderMenu() {

           data-name="${escapeHtml(item.name)}"

        <div class="bottom">
          <span class="price">${fmt(item.price)}</span>
          <button class="add-small" type="button">Add</button>
        </div>

    c.innerHTML = `
      <h2 class="section-title">Our Menu</h2>
      <p class="section-sub">Tap any drink to customise &amp; order</p>

      <div class="about-snippet" style="margin-top:18px;">
        <h3>Flat price, <span>every cup</span></h3>

    c.querySelectorAll(".menu-item").forEach(el => {

        openModal({
          name: this.dataset.name,
          price: parseFloat(this.dataset.price),
          img: this.dataset.img,
          desc: this.dataset.desc
        });
      });
    });
    c.querySelectorAll(".add-small").forEach(btn => {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        const el = this.closest(".menu-item");
        openModal({
          name: el.dataset.name,
          price: parseFloat(el.dataset.price),
          img: el.dataset.img,
          desc: el.dataset.desc
        });
      });
    });
  }

  /* ---------- CART ---------- */
  function renderCart() {
    const c = $("pageCart");
    if (!c) return;

    if (cart.length === 0) {
      c.innerHTML = `
        <h2 class="section-title">🛒 Your Cart</h2>
        <p class="section-sub">Add a cup to get started</p>
        <div class="cart-empty">
          <i class="fas fa-shopping-bag"></i>
          <h3>Your cart is empty</h3>
          <p>Two ice-cold cups are waiting for you.</p>
          <button class="btn" type="button" onclick="switchTab('menu')"
            style="margin-top:18px;background:var(--primary);color:var(--text-inverse);padding:12px 26px;border-radius:9999px;font-weight:800;font-size:14px;border:none;cursor:pointer;font-family:inherit;">
            <i class="fas fa-mug-hot"></i> Browse Menu
          </button>
        </div>
      `;
      return;
    }

    let html = `
      <h2 class="section-title">🛒 Your Cart</h2>
      <p class="section-sub">${cartCount()} cup${cartCount() > 1 ? "s" : ""} in cart</p>
      <div class="cart-list">
    `;

    cart.forEach((item, idx) => {
      html += `
        <div class="cart-item">
          ${imgTag(item.img, item.name)}
          <div class="info">
            <h4>${escapeHtml(item.name)}</h4>
            <div class="price">${fmt(item.price)}</div>
            ${item.request ? '<div class="request">📝 ' + escapeHtml(item.request) + "</div>" : ""}
          </div>
          <div class="controls">
            <button class="qty-dec" data-idx="${idx}" aria-label="Decrease">−</button>
            <span class="qty">${item.qty}</span>
            <button class="qty-inc" data-idx="${idx}" aria-label="Increase">+</button>
            <button class="remove" data-idx="${idx}" aria-label="Remove">✕</button>
          </div>
        </div>
      `;
    });

    html += `</div>`;

    const total = cartTotal();
    html += `
      <div class="cart-summary">
        <div class="row"><span>Subtotal</span><span>${fmt(total)}</span></div>
        <div class="row"><span>Service charge</span><span>RM0.00</span></div>
        <div class="row total"><span>Total</span><span class="amount">${fmt(total)}</span></div>
        <button class="checkout-btn" id="cartCheckoutBtn" type="button">
          <i class="fab fa-whatsapp"></i> Order via WhatsApp
        </button>
        <button class="alt-btn" id="cartEmailBtn" type="button">
          <i class="fas fa-envelope"></i> Send Order by Email
        </button>
      </div>
    `;

    c.innerHTML = html;

    c.querySelectorAll(".qty-dec").forEach(b => b.addEventListener("click", function () {
      const i = parseInt(this.dataset.idx, 10);
      if (cart[i].qty > 1) cart[i].qty--; else cart.splice(i, 1);
      saveCart(); renderCart(); updateBadges();
    }));
    c.querySelectorAll(".qty-inc").forEach(b => b.addEventListener("click", function () {
      const i = parseInt(this.dataset.idx, 10);
      cart[i].qty++;
      saveCart(); renderCart(); updateBadges();
    }));
    c.querySelectorAll(".remove").forEach(b => b.addEventListener("click", function () {
      const i = parseInt(this.dataset.idx, 10);
      cart.splice(i, 1);
      saveCart(); renderCart(); updateBadges();
      toast("Item removed from cart");
    }));

    const co = $("cartCheckoutBtn");
    if (co) co.addEventListener("click", placeOrder);
    const em = $("cartEmailBtn");
    if (em) em.addEventListener("click", emailOrder);
  }

  /* ---------- ORDERS ---------- */
  function renderOrders() {
    const c = $("pageOrders");
    if (!c) return;

    if (orders.length === 0) {
      c.innerHTML = `
        <h2 class="section-title">📦 Order History</h2>
        <p class="section-sub">Your past orders</p>
        <div class="order-empty">
          <i class="fas fa-clock-rotate-left"></i>
          <h3>No orders yet</h3>
          <p>Your order history will appear here.</p>
        </div>
      `;
      return;
    }

    let html = `
      <h2 class="section-title">📦 Order History</h2>
      <p class="section-sub">${orders.length} order${orders.length > 1 ? "s" : ""} placed</p>
    `;

    orders.forEach((o, i) => {
      html += `
        <div class="order-card">
          <div class="top">
            <span class="date">${escapeHtml(o.date || "Order #" + (i + 1))}</span>
            <span class="status">✓ Sent</span>
          </div>
          <div class="items">${o.items.map(it => escapeHtml(it.name) + " ×" + it.qty).join(" • ")}</div>
          <div class="total">${fmt(o.total)}</div>
        </div>
      `;
    });

    html += `<button class="clear-orders-btn" id="clearOrdersBtn" type="button">
               <i class="fas fa-trash-can"></i> Clear All Orders
             </button>`;

    c.innerHTML = html;

    $("clearOrdersBtn").addEventListener("click", function () {
      if (confirm("Clear all order history? This cannot be undone.")) {
        orders = [];
        saveOrders();
        renderOrders();
        toast("Order history cleared");
      }
    });
  }

  /* ---------- PROFILE ---------- */
  function renderProfile() {
    const c = $("pageProfile");
    if (!c) return;

    c.innerHTML = `
      <div class="profile-card">
        <div class="logo" aria-hidden="true">
          <img src="logo.webp" alt="ZUS Coffee Ngupi @ Restoran Pak Haji Ali logo" />
        </div>
        <h2>ZUS Coffee Ngupi</h2>
        <div class="sub">@ Restoran Pak Haji Ali • Ice-Cold Coffee</div>
        <div class="badge-row">
          <span><i class="fas fa-tag"></i> RM3.90 Flat</span>
          <span><i class="fas fa-mug-hot"></i> Fresh Brewed</span>
          <span><i class="fas fa-snowflake"></i> Ice-Cold Only</span>
        </div>
      </div>

      <div class="profile-hours">
        <h4><i class="fas fa-clock"></i> Opening Hours</h4>
        <p><i class="fas fa-calendar-day"></i> Open Daily</p>
        <p><i class="fas fa-snowflake"></i> All drinks served ice-cold</p>
      </div>

      <div class="contact-box">
        <h4><i class="fas fa-address-card"></i> Contact Us</h4>
        <a href="tel:+${SHOP.phoneIntl}"><i class="fas fa-phone"></i> ${SHOP.phoneDisplay}</a>
        <a href="mailto:${SHOP.email}"><i class="fas fa-envelope"></i> ${SHOP.email}</a>
        <a href="${SHOP.waBase}" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> WhatsApp</a>
      </div>

      <div class="profile-links">
        <a href="${SHOP.waBase}?text=${encodeURIComponent("Hi " + SHOP.name + "! I would like to order ice-cold coffee.")}" target="_blank" rel="noopener">
          <i class="fab fa-whatsapp"></i> Order WhatsApp
        </a>
        <a href="tel:+${SHOP.phoneIntl}"><i class="fas fa-phone"></i> Call Us</a>
        <a href="mailto:${SHOP.email}?subject=${encodeURIComponent("Coffee Order — " + SHOP.name)}">
          <i class="fas fa-envelope"></i> Email Order
        </a>
        <a href="#pageMenu" onclick="switchTab('menu');return false;">
          <i class="fas fa-mug-hot"></i> View Menu
        </a>
      </div>

      <div class="notice-box">
        <i class="fas fa-circle-info"></i>
        <strong>ZUS Coffee Ngupi @ Restoran Pak Haji Ali</strong> — White Coffee &amp; Chocolate Coffee, RM3.90 per cup.
        Served ice-cold. Orders placed through this app are sent to our WhatsApp for confirmation.
      </div>

      <div class="notice-box" style="margin-top:12px;border-left-color:var(--separator-heavy);">
        <i class="fas fa-code"></i>
        <a href="${SHOP.siteUrl}" style="color:var(--primary);text-decoration:none;font-weight:700;">${SHOP.siteUrl.replace("https://", "")}</a>
      </div>
    `;
  }

  /* ---------- MODAL ---------- */
  function openModal(product) {
    modalData = product;
    isModalOpen = true;

    const img = $("modalImg");
    img.src = product.img || FALLBACK_IMG;
    img.onerror = function () { this.onerror = null; this.src = FALLBACK_IMG; };

    $("modalName").textContent = product.name;
    $("modalDesc").textContent = product.desc || "";
    $("modalPrice").textContent = fmt(product.price);
    $("modalQty").value = 1;
    $("modalRequest").value = "";

    $("iosModal").classList.add("open");
    document.body.style.overflow = "hidden";
    updateModalWaLink();
  }

  function closeModal() {
    $("iosModal").classList.remove("open");
    document.body.style.overflow = "";
    modalData = null;
    isModalOpen = false;
  }

  function updateModalWaLink() {
    if (!modalData) return;
    const qty = Math.max(1, parseInt($("modalQty").value, 10) || 1);
    const req = $("modalRequest").value.trim();
    const total = modalData.price * qty;

    let msg = "Hi " + SHOP.name + "! I'd like to order:\n\n";
    msg += "🧊 " + modalData.name + " ×" + qty + " = " + fmt(total) + "\n";
    if (req) msg += "📝 Special request: " + req + "\n";
    msg += "\nPlease confirm my order. Thank you! 🙏";

    $("modalWaBtn").href = SHOP.waBase + "?text=" + encodeURIComponent(msg);
  }

  function addFromModal() {
    if (!modalData) return;
    const qty = Math.max(1, parseInt($("modalQty").value, 10) || 1);
    const req = $("modalRequest").value.trim();

    const idx = cart.findIndex(i => i.name === modalData.name && (i.request || "") === req);
    if (idx !== -1) {
      cart[idx].qty += qty;
    } else {
      cart.push({
        name: modalData.name,
        price: modalData.price,
        qty: qty,
        img: modalData.img,
        request: req
      });
    }

    saveCart();
    renderCart();
    updateBadges();

    const label = modalData.name;
    closeModal();
    toast("Added " + label + " ×" + qty + " to cart");
  }

  /* ---------- ORDER BUILDERS ---------- */
  function buildOrderText() {
    const total = cartTotal();
    let msg = "Hi " + SHOP.name + "! I'd like to place an order:\n\n";
    cart.forEach(it => {
      msg += "🧊 " + it.name + " ×" + it.qty + " = " + fmt(it.price * it.qty) + "\n";
      if (it.request) msg += "   📝 " + it.request + "\n";
    });
    msg += "\n━━━━━━━━━━━━━━\n";
    msg += "Total: " + fmt(total) + "\n\n";
    msg += "Please confirm my order. Thank you! 🙏";
    return { msg: msg, total: total };
  }

  function recordOrder(total) {
    orders.unshift({
      date: new Date().toLocaleString("en-MY", {
        day: "2-digit", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      }),
      items: cart.map(i => ({ name: i.name, qty: i.qty })),
      total: total
    });
    saveOrders();
    renderOrders();
  }

  function clearCart() {
    cart = [];
    saveCart();
    renderCart();
    updateBadges();
  }

  function placeOrder() {
    if (cart.length === 0) { toast("Your cart is empty"); return; }
    const { msg, total } = buildOrderText();
    recordOrder(total);
    clearCart();
    window.open(SHOP.waBase + "?text=" + encodeURIComponent(msg), "_blank");
    toast("Order sent! Redirecting to WhatsApp…");
    switchTab("orders");
  }

  function emailOrder() {
    if (cart.length === 0) { toast("Your cart is empty"); return; }
    const { msg, total } = buildOrderText();
    recordOrder(total);
    clearCart();
    window.location.href = "mailto:" + SHOP.email +
      "?subject=" + encodeURIComponent("Coffee Order — " + SHOP.name) +
      "&body=" + encodeURIComponent(msg);
    toast("Opening your email app…");
    switchTab("orders");
  }

  /* ---------- TABS ---------- */
  function switchTab(tabId) {
    currentTab = tabId;

    document.querySelectorAll(".ios-tabs button").forEach(btn => {
      const active = btn.dataset.tab === tabId;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-selected", active ? "true" : "false");
    });

    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    const target = $("page" + tabId.charAt(0).toUpperCase() + tabId.slice(1));
    if (target) target.classList.add("active");

    if (tabId === "home") renderHome();
    else if (tabId === "menu") renderMenu();
    else if (tabId === "cart") renderCart();
    else if (tabId === "orders") renderOrders();
    else if (tabId === "profile") renderProfile();

    history.replaceState(null, "", "#" + tabId);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  window.switchTab = switchTab;
  window.openModal = openModal;
  window.closeModal = closeModal;

  /* ---------- INIT ---------- */
  document.addEventListener("DOMContentLoaded", function () {
    loadCart();
    loadOrders();

    document.querySelectorAll(".ios-tabs button").forEach(btn => {
      btn.addEventListener("click", function () { switchTab(this.dataset.tab); });
    });

    const hcb = $("headerCartBtn");
    if (hcb) hcb.addEventListener("click", () => switchTab("cart"));

    const modal = $("iosModal");
    modal.addEventListener("click", function (e) { if (e.target === this) closeModal(); });

    $("modalQtyMinus").addEventListener("click", function () {
      const el = $("modalQty");
      let v = parseInt(el.value, 10) || 1;
      if (v > 1) v--;
      el.value = v;
      updateModalWaLink();
    });

    $("modalQtyPlus").addEventListener("click", function () {
      const el = $("modalQty");
      let v = parseInt(el.value, 10) || 1;
      if (v < 99) v++;
      el.value = v;
      updateModalWaLink();
    });

    $("modalQty").addEventListener("change", function () {
      let v = parseInt(this.value, 10) || 1;
      if (v < 1) v = 1;
      if (v > 99) v = 99;
      this.value = v;
      updateModalWaLink();
    });

    $("modalRequest").addEventListener("input", updateModalWaLink);
    $("modalAddCart").addEventListener("click", addFromModal);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && isModalOpen) closeModal();
    });

    const hash = (location.hash || "").replace("#", "");
    const valid = ["home", "menu", "cart", "orders", "profile"];
    switchTab(valid.indexOf(hash) !== -1 ? hash : "home");

    console.log("🧊 ZUS Coffee Ngupi @ Restoran Pak Haji Ali app loaded");
  });
})();

/* ============================================================
   THEME TOGGLE
   ============================================================ */
(function () {
  const saved = localStorage.getItem("ngupi-theme") || "light";
  const toggle = document.getElementById("themeToggle");
  const icon = document.getElementById("themeIcon");
  const meta = document.getElementById("themeColor");

  function apply(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("ngupi-theme", theme);
    icon.className = theme === "dark" ? "fas fa-sun" : "fas fa-moon";
    if (meta) meta.setAttribute("content", theme === "dark" ? "#080b14" : "#0b2a72");
  }

  apply(saved);

  toggle.addEventListener("click", function () {
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    apply(cur === "light" ? "dark" : "light");
  });
})();
</script>
